# zmq-sys always builds its vendored libzmq (zeromq-src) without libzmq's CMake platform checks, so
# `HAVE_POSIX_MEMALIGN` is never defined and `yqueue_t` falls back to `malloc` (16-byte aligned) for
# chunks of the 64-byte-aligned `command_t`. Any compile that emits 32-byte AVX moves
# (`-march=x86-64-v3`, the default gcc on amd64v3 Ubuntu, e.g. GitHub's ubuntu-26.04 runner) then
# SIGSEGVs in `ypipe_t::write` on the first `connect`. Supply the two defines CMake would set on Linux.
# A CXXFLAGS already in your environment wins over this, so keep these two defines in it if you set
# your own. Cargo does not apply a dependency's config to its dependents: crates that build zmq
# binaries on top of pericortex (cortex, latexml-oxide's cortex_worker) need this same stanza.
# Details: CorTeX docs/KNOWN_ISSUES.md L-2.
[env]
CXXFLAGS = "-DHAVE_POSIX_MEMALIGN=1 -DZMQ_CACHELINE_SIZE=64"
